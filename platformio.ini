[platformio]
default_envs = hello-display
src_dir = apps
extra_configs = config/sticks3.ini

[env:hello-display]
extends = sticks3
build_src_filter =
    +<hello-display/src/>

[env:imu-monitor]
extends = sticks3
build_src_filter =
    +<imu-monitor/src/>

[env:voice-memo]
extends = sticks3
build_src_filter =
    +<voice-memo/src/>
