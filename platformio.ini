[platformio]
default_envs = hello-display
src_dir = apps
extra_configs = config/sticks3.ini

[env:hello-display]
extends = sticks3
build_src_filter =
    +<hello-display/src/>

[env:imu-monitor]
extends = sticks3
build_src_filter =
    +<imu-monitor/src/>

[env:voice-memo]
extends = sticks3
build_src_filter =
    +<voice-memo/src/>

[env:head-tracker]
extends = sticks3
build_src_filter =
    +<head-tracker/src/>
lib_deps =
    ${sticks3.lib_deps}
    bblanchon/ArduinoJson@7.4.2
